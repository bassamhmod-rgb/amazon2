{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}تسليم مستخدم{% endblock %} – {{ store.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body{margin:0;background:#f7f9fc;color:#1a2a4a;font-family:Tahoma,Arial,sans-serif}
        .sidebar{box-sizing:border-box;width:230px;background:white;height:100vh;position:fixed;top:0;right:0;padding:20px 15px;border-left:1px solid #e0e0e0;z-index:1000}
        .sidebar a{display:block;padding:10px 12px;margin-bottom:8px;color:#333;border-radius:8px;text-decoration:none}
        .sidebar a:hover{background:#e9f2ff}
        main{margin-right:240px;padding:24px;min-width:0}
        .handover-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
        .handover-card{display:block;padding:18px;background:white;border:1px solid #dde5ef;border-radius:14px;text-decoration:none;color:inherit}
        .handover-card:hover{border-color:#285ea0;background:#f0f5fb}
        .handover-value{font-size:1.4rem;font-weight:700;margin:8px 0;overflow-wrap:anywhere}
        .handover-due{background:#102f55;color:white;border-radius:14px;padding:22px}
        .table td,.table th{vertical-align:middle;overflow-wrap:anywhere}
        .table td{max-width:280px}
        #sidebarToggle{display:none}
        .pdf-frame{width:100%;height:calc(100vh - 240px);min-height:450px;border:1px solid #ccd5e0;border-radius:10px;background:#dde5ef}
        @media(max-width:768px){main{margin-right:0;padding:16px}.sidebar{display:none;width:min(280px,85vw)}.sidebar.open{display:block}#sidebarToggle{display:inline-block}.handover-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.handover-card{padding:12px}.handover-value{font-size:1.15rem}}
    </style>
</head>
<body>
{% include "dashboard/sidebar.html" %}
<main>
    <button id="sidebarToggle" class="btn btn-outline-secondary mb-3" type="button" aria-controls="sidebar" aria-expanded="false">القائمة</button>
    {% block content %}{% endblock %}
</main>
<script src="{% static 'js/user_handover.js' %}?v=20261115-2" defer></script>
</body>
</html>
