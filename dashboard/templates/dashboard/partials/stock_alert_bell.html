<style>
    .stock-alert-bell {
        position: relative;
        flex-shrink: 0;
        z-index: 1020;
        direction: rtl;
    }
    .stock-alert-bell > summary {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        list-style: none;
        cursor: pointer;
        color: #1a2a4a;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 50%;
        box-shadow: 0 3px 12px #1a2a4a1a;
    }
    .stock-alert-bell > summary::-webkit-details-marker { display: none; }
    .stock-alert-bell > summary::marker { content: ""; }
    .stock-alert-bell > summary:hover,
    .stock-alert-bell[open] > summary { background: #edf3fb; }
    .stock-alert-bell > summary:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    .stock-alert-badge {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 19px;
        padding: 2px 5px;
        border-radius: 12px;
        background: #dc3545;
        color: #fff;
        font-size: 11px;
        line-height: 15px;
        text-align: center;
    }
    .stock-alert-panel {
        position: absolute;
        top: 56px;
        left: 0;
        width: min(340px, calc(100vw - 40px));
        max-height: min(420px, 65vh);
        overflow-y: auto;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        box-shadow: 0 8px 30px #1a2a4a26;
        text-align: right;
    }
    .stock-alert-panel h6 { margin: 0; padding: 16px; color: #1a2a4a; font-weight: 700; }
    .stock-alert-item { padding: 12px 16px; border-top: 1px solid #edf0f5; }
    .stock-alert-item strong { display: block; overflow-wrap: anywhere; margin-bottom: 4px; }
    .stock-alert-item small { color: #64748b; }
</style>

<details class="stock-alert-bell" id="stockAlertBell">
    <summary title="تنبيه الكميات" aria-label="تنبيه الكميات، {{ low_stock_alert_count|default:0 }} مواد" aria-controls="stockAlertPanel">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
        </svg>
        {% if low_stock_alert_count > 0 %}
            <span class="stock-alert-badge" aria-hidden="true">{{ low_stock_alert_count }}</span>
        {% endif %}
    </summary>
    <section class="stock-alert-panel" id="stockAlertPanel" aria-label="المواد التي وصلت لحد التنبيه">
        <h6>تنبيه الكميات</h6>
        {% for product in low_stock_alert_products %}
            <div class="stock-alert-item">
                <strong>{{ product.name }}</strong>
                <small>المتوفر: {{ product.real_stock }} · حد التنبيه: {{ product.stock_alert_threshold }}</small>
            </div>
        {% empty %}
            <div class="stock-alert-item text-muted small">لا توجد تنبيهات كميات حاليًا.</div>
        {% endfor %}
    </section>
</details>
<script>
    (() => {
        const bell = document.getElementById('stockAlertBell');
        document.addEventListener('click', (event) => {
            if (bell.open && !bell.contains(event.target)) bell.open = false;
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && bell.open) {
                bell.open = false;
                bell.querySelector('summary').focus();
            }
        });
    })();
</script>
