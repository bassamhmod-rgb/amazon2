<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}مناقلات المستودعات{% endblock %} – {{ store.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {background:#f7f9fc; font-family:Tahoma,sans-serif;}
        .sidebar {width:230px; background:white; height:100vh; overflow-y:auto; position:fixed; top:0; right:0; padding:20px 15px; border-left:1px solid #e0e0e0; z-index:1000;}
        .sidebar a {display:block; padding:10px 12px; margin-bottom:8px; color:#333; border-radius:8px; text-decoration:none;}
        .sidebar a:hover {background:#e9f2ff; color:#0d6efd;}
        .content {margin-right:240px; padding:24px;}
        #sidebarArrow {display:none;}
        .errorlist {color:#b02a37; padding-right:18px;}
        @media(max-width:768px) {
            .sidebar {right:-260px;} .sidebar.active {right:0;} .content {margin-right:0; padding:16px;}
            #sidebarArrow {display:block; position:fixed; right:0; top:50%; z-index:1001; background:#1A2A4A; color:white; border:0; padding:12px 6px; border-radius:8px 0 0 8px;}
        }
    </style>
</head>
<body>
<button id="sidebarArrow" aria-label="فتح القائمة" type="button">❯</button>
{% include 'dashboard/sidebar.html' %}
<main class="content">
    {% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
<script>document.getElementById('sidebarArrow').onclick = () => document.getElementById('sidebar').classList.toggle('active');</script>
{% block scripts %}{% endblock %}
</body>
</html>
